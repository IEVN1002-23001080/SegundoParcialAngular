
<div class="min-h-screen bg-gray-100 p-6 rounded-xl">

  <div class="max-w-4xl mx-auto">

    <div class="bg-emerald-400 text-white p-6 rounded-t-xl">
      <h1 class="text-3xl font-bold">
        Registro de alumnos
      </h1>
      <p class="mt-2 text-emerald-100">
        Ingresa los datos para agregar un alumno a la lista.
      </p>
    </div>

    <div class="bg-white p-6 rounded-b-xl shadow-md">

      <form [formGroup]="formulario" (ngSubmit)="muestraAlumnos()">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <div>
            <label for="matricula"
              class="block mb-2 text-sm font-semibold text-gray-700">
              Matrícula
            </label>

            <input
              type="text"
              id="matricula"
              formControlName="matricula"
              class="w-full p-3 border border-gray-300 rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
          </div>

          <div>
            <label for="nombre"
              class="block mb-2 text-sm font-semibold text-gray-700">
              Nombre completo
            </label>

            <input
              type="text"
              id="nombre"
              formControlName="nombre"
              class="w-full p-3 border border-gray-300 rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
          </div>

          <div>
            <label for="correo"
              class="block mb-2 text-sm font-semibold text-gray-700">
              Correo electrónico
            </label>

            <input
              type="email"
              id="correo"
              formControlName="correo"
              class="w-full p-3 border border-gray-300 rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
          </div>

          <div>
            <label for="materia"
              class="block mb-2 text-sm font-semibold text-gray-700">
              Materia
            </label>

            <input
              type="text"
              id="materia"
              formControlName="materia"
              class="w-full p-3 border border-gray-300 rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
          </div>

        </div>

        <div class="flex flex-wrap justify-end gap-3 mt-6">

          <button
            type="submit"
            class="bg-emerald-300 text-white px-6 py-3 rounded-md font-semibold hover:bg-emerald-700 transition">
            Registrar
          </button>

          <button
            type="button"
            (click)="cargarAlumnos()"
            class="bg-gray-600 text-white px-6 py-3 rounded-md font-semibold hover:bg-gray-700 transition">
            Cargar lista
          </button>

        </div>

      </form>

      <div class="mt-10">

        <div class="flex items-center justify-between mb-4">
          <h2 class="text-2xl font-bold text-gray-800">
            Alumnos registrados
          </h2>

          <span class="text-sm text-emerald-700 font-medium">
            Total: {{ alumnos.length }}
          </span>
        </div>

        <div class="overflow-x-auto border border-gray-200 rounded-lg">

          <table class="w-full text-sm text-left text-gray-600">

            <thead class="bg-emerald-50 text-emerald-900">
              <tr>
                <th class="px-5 py-4">Matrícula</th>
                <th class="px-5 py-4">Nombre</th>
                <th class="px-5 py-4">Correo</th>
                <th class="px-5 py-4">Materia</th>
                <th class="px-5 py-4">Acciones</th>
              </tr>
            </thead>

            <tbody>

              <tr
                *ngFor="let alumno1 of alumnos; let i = index"
                class="border-t border-gray-200 hover:bg-emerald-50">

                <td class="px-5 py-4 font-medium text-gray-800">
                  {{ alumno1.matricula }}
                </td>

                <td class="px-5 py-4">
                  {{ alumno1.nombre }}
                </td>

                <td class="px-5 py-4">
                  {{ alumno1.correo }}
                </td>

                <td class="px-5 py-4">
                  {{ alumno1.materia }}
                </td>

                <td class="px-5 py-4">
                  <div class="flex gap-2">

                    <button
                      type="button"
                      (click)="editarAlumnos(i)"
                      class="bg-amber-500 text-white px-3 py-2 rounded-md hover:bg-amber-600">
                      Editar
                    </button>

                    <button
                      type="button"
                      (click)="eliminarAlumno(i)"
                      class="bg-rose-600 text-white px-3 py-2 rounded-md hover:bg-rose-700">
                      Eliminar
                    </button>

                  </div>
                </td>

              </tr>

            </tbody>

          </table>

        </div>

        <div
          *ngIf="alumnos.length === 0"
          class="mt-4 p-5 bg-gray-50 border border-gray-200 rounded-lg text-center text-gray-500">

          Todavía no hay alumnos registrados.

        </div>

      </div>

    </div>

  </div>

</div>
```

<div class="min-h-screen bg-gray-50 p-4 md:p-8">
  <div class="mx-auto max-w-3xl">

    <div class="rounded-2xl bg-white p-6 shadow-lg">

      <h1 class="mb-2 text-2xl font-bold text-gray-800">
        Editar alumno
      </h1>

      <p class="mb-6 text-gray-500">
        Modifica la información del alumno seleccionado.
      </p>

      <div
        *ngIf="cargandoDatos"
        class="py-6 text-center text-gray-500">
        Cargando información...
      </div>

      <form
  [formGroup]="formulario"
        [formGroup]="formulario"
        (ngSubmit)="onSubmit()"
        class="grid grid-cols-1 gap-5 md:grid-cols-2">

        <div>
          <label class="mb-1 block font-medium text-gray-700">
            Matrícula
          </label>

          <input
            type="number"
            formControlName="matricula"
            class="w-full rounded-lg border border-gray-300 bg-gray-100 p-3">
        </div>

        <div>
          <label class="mb-1 block font-medium text-gray-700">
            Nombre
          </label>

          <input
            type="text"
            formControlName="nombre"
            class="w-full rounded-lg border border-gray-300 p-3">
        </div>

        <div>
          <label class="mb-1 block font-medium text-gray-700">
            Apellido paterno
          </label>

          <input
            type="text"
            formControlName="apaterno"
            class="w-full rounded-lg border border-gray-300 p-3">
        </div>

        <div>
          <label class="mb-1 block font-medium text-gray-700">
            Apellido materno
          </label>

          <input
            type="text"
            formControlName="amaterno"
            class="w-full rounded-lg border border-gray-300 p-3">
        </div>

        <div class="md:col-span-2">
          <label class="mb-1 block font-medium text-gray-700">
            Correo electrónico
          </label>

          <input
            type="email"
            formControlName="correo"
            class="w-full rounded-lg border border-gray-300 p-3">

          <small
            *ngIf="formulario.get('correo')?.touched && formulario.get('correo')?.invalid"
            class="text-red-600">
            Ingresa un correo válido.
          </small>
        </div>

        <p
          *ngIf="mensaje"
          class="text-red-600 md:col-span-2">
          {{ mensaje }}
        </p>

        <div class="flex gap-3 md:col-span-2">

          <button
            type="submit"
            [disabled]="cargando"
            class="rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700 disabled:opacity-50">
            {{ cargando ? 'Guardando...' : 'Guardar cambios' }}
          </button>

          <a
            routerLink="/utl/alumnos"
            class="rounded-lg bg-gray-200 px-5 py-3 font-semibold text-gray-700 hover:bg-gray-300">
            Cancelar
          </a>

        </div>

      </form>

      <p
        *ngIf="!cargandoDatos && mensaje && !formulario.valid"
        class="mt-3 text-red-600">
        {{ mensaje }}
      </p>

    </div>
  </div>
</div>
